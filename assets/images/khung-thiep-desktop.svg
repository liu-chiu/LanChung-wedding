<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5" />
      <stop offset="100%" stop-color="#ffe3e3" />
    </linearGradient>
    <style>
      .card-border {
        fill: none;
        stroke: #d63384;
        stroke-width: 6;
      }
      .card-inner {
        fill: none;
        stroke: #f87171;
        stroke-width: 2;
        stroke-dasharray: 8 4;
      }
    </style>
  </defs>
  <!-- Nền thiệp -->
  <rect width="1920" height="1080" fill="url(#card-gradient)" />
  
  <!-- Viền trang trí -->
  <rect x="80" y="80" width="1760" height="920" rx="16" class="card-border" />
  <rect x="100" y="100" width="1720" height="880" rx="12" class="card-inner" />
</svg>