<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1526" />
  <meta name="description" content="Thiệp cưới Lan và Chung, ngày 12 tháng 12 năm 2026 — Bìa ngoài" />
  <title>Lan & Chung | Mở thiệp · 12.12.2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Manrope:wght@300;400;500;600;700&display=swap&subset=vietnamese"
    rel="stylesheet" />

  <style>
    /* ======================================================================
       BÌA NGOÀI THIỆP CƯỚI — LAN & CHUNG | 12.12.2026
       Thiết kế mới: Bầu trời đêm đầy sao lấp lánh
       Vẫn giữ bảng màu gốc của dự án làm điểm nhấn:
         --rose #d88a80 · --gold #e9ad32 · --green #397f7d
       ====================================================================== */

    :root {
      /* màu nền trời đêm */
      --night-1: #0a1120;
      --night-2: #101d33;
      --night-3: #16263f;
      /* palette gốc của dự án */
      --rose: #d88a80;
      --pink: #deb6b4;
      --gold: #e9ad32;
      --gold-soft: rgba(233, 173, 50, 0.55);
      --green: #397f7d;
      --green-deep: #245c58;
      --ink: #292723;
      --paper: #fffdf9;
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --sans: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      --script: 'Great Vibes', cursive;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font: clamp(14px, 1.05vw, 16px)/1.72 var(--sans);
      color: var(--paper);
      background: var(--night-1);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font: inherit;
      color: inherit;
    }

    .skip {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .skip:focus {
      position: fixed;
      left: 1rem;
      top: 1rem;
      z-index: 3000;
      background: var(--paper);
      color: var(--ink);
      padding: 0.8rem 1.2rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    /* ======================================================================
       1. BẦU TRỜI ĐÊM
       ====================================================================== */
    .cover {
      position: relative;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(1.4rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1.4rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse 120% 90% at 50% -10%, var(--night-3) 0%, var(--night-2) 42%, var(--night-1) 78%),
        var(--night-1);
    }

    /* Vầng sáng xanh mờ rọi từ trên xuống giữa màn hình */
    .cover::before {
      content: "";
      position: absolute;
      top: -12%;
      left: 50%;
      width: min(120vw, 900px);
      aspect-ratio: 1;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(120, 160, 220, 0.16) 0%, transparent 62%);
      pointer-events: none;
      z-index: 0;
    }

    /* Hai lớp sao: nhỏ lấp lánh & sao to nhấp nháy */
    .stars,
    .stars--big {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .stars {
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(190, 210, 255, 0.7) 0 1px, transparent 1.7px),
        radial-gradient(circle, rgba(255, 244, 214, 0.65) 0 .8px, transparent 1.5px);
      background-size: 170px 190px, 230px 260px, 280px 210px;
      background-position: 0 0, 60px 90px, 140px 40px;
      opacity: 0.75;
      animation: starDrift 60s linear infinite, starTwinkle 5s ease-in-out infinite alternate;
    }

    .stars--big {
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 1) 0 1.6px, transparent 2.6px),
        radial-gradient(circle, rgba(233, 173, 50, 0.9) 0 1.4px, transparent 2.4px),
        radial-gradient(circle, rgba(216, 138, 128, 0.85) 0 1.4px, transparent 2.4px);
      background-size: 420px 380px, 520px 460px, 610px 540px;
      background-position: 30px 20px, 200px 150px, 380px 90px;
      opacity: 0.9;
      animation: starTwinkle 3.2s ease-in-out infinite alternate;
    }

    @keyframes starDrift {
      to {
        background-position: 170px 190px, 290px 350px, 420px 250px;
      }
    }

    @keyframes starTwinkle {
      from {
        opacity: 0.4;
      }

      to {
        opacity: 1;
      }
    }

    /* Sao băng ngẫu nhiên rút qua bầu trời */
    .shooting-star {
      position: absolute;
      top: 12%;
      left: -10%;
      width: 120px;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 55%, #fff);
      border-radius: 999px;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transform: rotate(18deg);
      animation: shoot 9s ease-in infinite;
    }

    .shooting-star:nth-child(2) {
      top: 34%;
      animation-delay: 3.4s;
      animation-duration: 11s;
      width: 90px;
    }

    .shooting-star:nth-child(3) {
      top: 7%;
      animation-delay: 6.2s;
      animation-duration: 10s;
      width: 150px;
    }

    @keyframes shoot {
      0% {
        transform: translateX(0) translateY(0) rotate(18deg);
        opacity: 0;
      }

      3% {
        opacity: 1;
      }

      9% {
        transform: translateX(130vw) translateY(34vh) rotate(18deg);
        opacity: 0;
      }

      100% {
        opacity: 0;
      }
    }

    /* Tuyết bụi sáng trôi chậm (glitter dust) */
    .dust {
      position: absolute;
      inset: -10%;
      z-index: 1;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(233, 173, 50, 0.35) 0 1px, transparent 1.8px);
      background-size: 240px 240px, 320px 320px;
      background-position: 0 0, 120px 80px;
      opacity: 0.5;
      animation: dustFloat 26s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes dustFloat {
      from {
        transform: translate3d(-2%, -1%, 0);
      }

      to {
        transform: translate3d(2%, 2%, 0);
      }
    }

    /* Canvas pháo hoa khi mở thiệp */
    .burst-canvas {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }

    /* Đốm sáng bokeh lớn mờ rải rác trên nền */
    .bokeh {
      position: absolute;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      filter: blur(2px);
      animation: bokehFloat 14s ease-in-out infinite alternate;
    }
    .bokeh-1 {
      top: 14%; left: 8%;
      width: 10px; height: 10px;
      background: radial-gradient(circle, rgba(233,173,50,0.55), rgba(233,173,50,0) 70%);
    }
    .bokeh-2 {
      top: 62%; left: 13%;
      width: 16px; height: 16px;
      background: radial-gradient(circle, rgba(216,138,128,0.45), rgba(216,138,128,0) 70%);
      animation-delay: 3s; animation-duration: 18s;
    }
    .bokeh-3 {
      top: 22%; right: 10%;
      width: 13px; height: 13px;
      background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%);
      animation-delay: 6s;
    }
    .bokeh-4 {
      top: 74%; right: 16%;
      width: 9px; height: 9px;
      background: radial-gradient(circle, rgba(233,173,50,0.5), rgba(233,173,50,0) 70%);
      animation-delay: 1.5s; animation-duration: 16s;
    }
    .bokeh-5 {
      top: 42%; left: 5%;
      width: 7px; height: 7px;
      background: radial-gradient(circle, rgba(255,255,255,0.4), rgba(255,255,255,0) 70%);
      animation-delay: 8s;
    }
    @keyframes bokehFloat {
      from { transform: translate3d(0, 0, 0) scale(1); opacity: 0.55; }
      to   { transform: translate3d(14px, -18px, 0) scale(1.25); opacity: 1; }
    }

    /* ======================================================================
       2. NỘI DUNG BÌA
       ====================================================================== */
    .cover-content {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: clamp(0.75rem, 2vh, 1.15rem);
    }

    /* --- LOGO LIU CHIU trong vòng tròn vàng phát sáng ---
       Hiệu ứng: logo thở nhẹ + vành khuyết xoay + 3 chấm bụi vàng
       bay theo quỹ đạo tròn quanh logo */
    .cover-logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(108px, 26vw, 132px);
      aspect-ratio: 1;
      margin-bottom: 0.35rem;
      animation: riseIn 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
    }

    /* Vòng tròn chính + vành khuyết xoay chậm */
    .cover-logo-wrap::before,
    .cover-logo-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }
    .cover-logo-wrap::before {
      border: 1px solid rgba(233, 173, 50, 0.55);
      box-shadow:
        0 0 22px rgba(233, 173, 50, 0.28),
        inset 0 0 16px rgba(233, 173, 50, 0.16);
      animation: haloPulse 3.6s ease-in-out infinite;
    }
    .cover-logo-wrap::after {
      inset: -11px;
      border: 1px dashed rgba(233, 173, 50, 0.35);
      animation: haloSpin 26s linear infinite;
    }
    @keyframes haloPulse {
      0%, 100% { box-shadow: 0 0 18px rgba(233,173,50,0.22), inset 0 0 14px rgba(233,173,50,0.14); }
      50%      { box-shadow: 0 0 34px rgba(233,173,50,0.42), inset 0 0 20px rgba(233,173,50,0.22); }
    }
    @keyframes haloSpin {
      to { transform: rotate(360deg); }
    }

    /* 3 chấm bụi vàng bay theo quỹ đạo tròn quanh logo */
    .orbit-dot {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      animation: haloSpin linear infinite;
    }
    .orbit-dot::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 50%;
      width: 6px; height: 6px;
      margin-left: -3px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe9b8 0%, rgba(233,173,50,0.9) 55%, rgba(233,173,50,0) 75%);
      box-shadow: 0 0 10px rgba(233, 173, 50, 0.9);
    }
    .orbit-dot:nth-child(1) { animation-duration: 7s; }
    .orbit-dot:nth-child(1)::before { width: 7px; height: 7px; }
    .orbit-dot:nth-child(2) { animation-duration: 11s; animation-direction: reverse; }
    .orbit-dot:nth-child(2)::before { top: auto; bottom: -3px; width: 5px; height: 5px; opacity: 0.85; }
    .orbit-dot:nth-child(3) { animation-duration: 17s; }
    .orbit-dot:nth-child(3)::before { width: 4px; height: 4px; opacity: 0.7; top: 50%; left: -3px; margin-left: 0; margin-top: -2px; }

    /* Logo căn chính giữa: absolute center + hiệu ứng thở nhẹ */
    .cover-logo {
      position: absolute;
      top: 50%; left: 50%;
      width: 74%;
      transform: translate(-50%, -50%);
      animation: logoBreathe 4.2s ease-in-out infinite;
    }
    @keyframes logoBreathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 8px rgba(255,244,214,0.3)); }
      50%      { transform: translate(-50%, -50%) scale(1.05); filter: drop-shadow(0 0 16px rgba(255,244,214,0.55)); }
    }

    /* --- Eyebrow "THIỆP MỜI CƯỚI" với gạch chấm hai bên --- */
    .cover-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      font-size: clamp(0.66rem, 1.8vw, 0.8rem);
      font-weight: 600;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: rgba(255, 248, 232, 0.92);
      text-shadow: 0 0 14px rgba(255, 244, 214, 0.45);
      animation: riseIn 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.25s both;
    }

    .cover-eyebrow::before,
    .cover-eyebrow::after {
      content: "";
      flex: 0 0 auto;
      width: clamp(30px, 9vw, 56px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 244, 214, 0.85));
    }

    .cover-eyebrow::after {
      background: linear-gradient(90deg, rgba(255, 244, 214, 0.85), transparent);
    }

    .cover-eyebrow i {
      font-style: normal;
      font-size: 0.6em;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(233, 173, 50, 0.9);
      animation: sparklePulse 2.4s ease-in-out infinite;
    }

    /* --- Tên cô dâu chú rể --- */
    .cover-names {
      margin: 0;
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3rem, 12vw, 4.6rem);
      line-height: 1.14;
      color: #fff;
      text-shadow:
        0 0 22px rgba(255, 255, 255, 0.32),
        0 0 60px rgba(160, 190, 255, 0.22);
      animation: riseIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s both;
    }

    .cover-names .amp {
      display: block;
      font-size: 0.62em;
      color: var(--rose);
      text-shadow: 0 0 18px rgba(216, 138, 128, 0.65);
      margin: 0.02em 0;
    }

    /* --- Ngày cưới --- */
    .cover-date {
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--serif);
      font-size: clamp(0.95rem, 2.8vw, 1.2rem);
      font-weight: 500;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      color: rgba(255, 248, 232, 0.95);
      animation: riseIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.65s both;
    }

    .cover-date i {
      font-style: normal;
      color: var(--gold);
      font-size: 0.6em;
      text-shadow: 0 0 8px rgba(233, 173, 50, 0.8);
    }

    /* --- Khối kính mời khách --- */
    .guest-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.28rem;
      margin-top: 0.55rem;
      animation: riseIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.85s both;
    }

    .guest-block .prefix {
      font-size: clamp(0.6rem, 1.7vw, 0.72rem);
      font-weight: 600;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      text-transform: uppercase;
      color: rgba(255, 244, 214, 0.72);
    }

    .guest-block .name {
      position: relative;
      font-family: var(--script);
      font-size: clamp(1.5rem, 5vw, 2rem);
      line-height: 1.25;
      color: #fff;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
      padding: 0 0.5rem 0.1em;
    }

    .guest-block .name::after {
      content: "";
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(233, 173, 50, 0.75), transparent);
    }

    /* --- Nút MỞ THIỆP --- */
    .open-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      min-height: 52px;
      margin-top: 1.1rem;
      padding: 0.65rem 2.3rem;
      border: 1px solid rgba(255, 244, 214, 0.55);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
      color: #fff;
      font-size: clamp(0.68rem, 1.9vw, 0.8rem);
      font-weight: 600;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      box-shadow:
        0 0 0 5px rgba(255, 255, 255, 0.05),
        0 10px 30px rgba(0, 0, 0, 0.35),
        inset 0 0 18px rgba(255, 244, 214, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, border-color 0.25s ease;
      animation: riseIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 1.05s both;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .open-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -80%;
      width: 60%;
      height: 100%;
      background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-20deg);
      animation: btnShine 3.4s ease-in-out infinite;
    }

    @keyframes btnShine {

      0%,
      60% {
        left: -80%;
      }

      80%,
      100% {
        left: 130%;
      }
    }

    .open-btn:hover,
    .open-btn:focus-visible {
      border-color: rgba(233, 173, 50, 0.8);
      box-shadow:
        0 0 0 5px rgba(233, 173, 50, 0.1),
        0 14px 36px rgba(0, 0, 0, 0.4),
        0 0 28px rgba(233, 173, 50, 0.28),
        inset 0 0 18px rgba(233, 173, 50, 0.14);
      transform: translateY(-2px);
    }

    .open-btn:active {
      transform: scale(0.97);
    }

    .open-btn:focus-visible {
      outline: 2px solid rgba(233, 173, 50, 0.8);
      outline-offset: 4px;
    }

    .open-btn span {
      position: relative;
      z-index: 1;
    }

    /* --- Thông báo đếm ngược tự mở --- */
    .auto-open-note {
      margin: 0.7rem 0 0;
      min-height: 1.2em;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 244, 214, 0.55);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      animation: riseIn 1s ease 1.25s both;
    }

    .auto-open-note.is-visible {
      opacity: 1;
    }

    .auto-open-note b {
      color: var(--gold);
      font-weight: 700;
    }

    /* ======================================================================
       3. HIỆU ỨNG MỞ THIỆP (sau khi bấm)
       ====================================================================== */
    .cover.is-opening {
      animation: coverOut 1.5s cubic-bezier(0.5, 0, 0.2, 1) forwards;
    }

    @keyframes coverOut {
      0% {
        opacity: 1;
        filter: brightness(1);
      }

      30% {
        /* bùng sáng như chấn động ánh sáng */
        filter: brightness(1.9);
      }

      100% {
        opacity: 0;
        filter: brightness(2.6);
        transform: scale(1.12);
      }
    }

    .cover.is-opening .cover-content {
      animation: contentOut 1.2s cubic-bezier(0.4, 0, 0.7, 1) forwards;
    }

    @keyframes contentOut {
      0% {
        opacity: 1;
        transform: none;
        filter: blur(0);
      }

      35% {
        opacity: 1;
        transform: scale(1.04);
        filter: blur(0);
      }

      100% {
        opacity: 0;
        transform: scale(1.22);
        filter: blur(8px);
      }
    }

    /* ======================================================================
       4. ANIMATION CHUNG
       ====================================================================== */
    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(6px);
      }

      to {
        opacity: 1;
        transform: none;
        filter: blur(0);
      }
    }

    @keyframes sparklePulse {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    /* ======================================================================
       5. RESPONSIVE & GIẢM CHUYỂN ĐỘNG
       ====================================================================== */
    @media (max-height: 700px) {
      .cover-content {
        gap: 0.55rem;
      }

      .cover-logo-wrap {
        width: 92px;
      }

      .cover-names {
        font-size: clamp(2.5rem, 10vw, 3.6rem);
      }

      .open-btn {
        min-height: 46px;
        margin-top: 0.7rem;
      }

      .guest-block {
        margin-top: 0.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .stars,
      .stars--big,
      .dust,
      .shooting-star {
        animation: none;
        opacity: 0.6;
      }
    }
  </style>
</head>

<body>
  <a class="skip" href="#openBtn">Nhảy tới nút mở thiệp</a>

  <div class="cover" id="cover">
    <div class="stars" aria-hidden="true"></div>
    <div class="stars stars--big" aria-hidden="true"></div>
    <div class="dust" aria-hidden="true"></div>
    <span class="shooting-star" aria-hidden="true"></span>
    <span class="shooting-star" aria-hidden="true"></span>
    <span class="shooting-star" aria-hidden="true"></span>
  <span class="bokeh bokeh-1" aria-hidden="true"></span>
  <span class="bokeh bokeh-2" aria-hidden="true"></span>
  <span class="bokeh bokeh-3" aria-hidden="true"></span>
  <span class="bokeh bokeh-4" aria-hidden="true"></span>
  <span class="bokeh bokeh-5" aria-hidden="true"></span>
    <canvas class="burst-canvas" id="burstCanvas" aria-hidden="true"></canvas>

    <div class="cover-content">
      <!-- Logo Liu Chiu trong vòng tròn vàng phát sáng + bụi vàng bay quỹ đạo -->
      <div class="cover-logo-wrap" aria-hidden="true">
        <span class="orbit-dot"></span>
        <span class="orbit-dot"></span>
        <span class="orbit-dot"></span>
        <picture>
          <source media="(min-width: 768px)" srcset="assets/images/logo_liu_chiu_tablet.webp" />
          <img alt="" class="cover-logo" src="assets/images/logo_liu_chiu_mobile.webp" />
        </picture>
      </div>

      <span class="cover-eyebrow"><i>✦</i> The Wedding Invitation <i>✦</i></span>

      <h1 class="cover-names">
        Ngọc Lan
        <span class="amp">&amp;</span>
        Văn Chung
      </h1>

      <p class="cover-date">12 <i>·</i> 12 <i>·</i> 2026</p>

      <div class="guest-block">
        <span class="prefix">Kính mời</span>
        <span class="name" id="guestName">Quý khách</span>
      </div>

      <button class="open-btn" id="openBtn" type="button">
        <span>Mở thiệp</span>
      </button>

      <p class="auto-open-note" id="autoOpenNote" aria-hidden="true">
        Thiệp sẽ tự mở sau <b id="autoOpenSeconds">5</b>s
      </p>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var cover = document.getElementById("cover");
      var openBtn = document.getElementById("openBtn");
      var burstCanvas = document.getElementById("burstCanvas");
      var autoOpenNote = document.getElementById("autoOpenNote");
      var autoOpenSeconds = document.getElementById("autoOpenSeconds");

      /* ---- 1. Cá nhân hoá tên khách mời từ tham số ?guest=... ---- */
      try {
        var guest = new URLSearchParams(location.search).get("guest");
        if (guest && guest.trim()) {
          document.getElementById("guestName").textContent = guest.trim();
        }
      } catch (e) { /* bỏ qua */ }

      /* ---- 2. Pháo hoa bụi sao khi mở thiệp ---- */
      function playOpeningBurst() {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var ctx = burstCanvas.getContext("2d");
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        burstCanvas.width = window.innerWidth * dpr;
        burstCanvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);

        var cx = window.innerWidth / 2;
        var cy = window.innerHeight * 0.42;
        var palette = [
          "255, 244, 214",  // vàng sáng
          "233, 173, 50",   // gold
          "255, 255, 255",  // trắng
          "216, 138, 128",  // rose
          "150, 190, 255"   // xanh băng
        ];
        var particles = [];

        for (var ring = 0; ring < 2; ring++) {
          var count = ring === 0 ? 70 : 45;
          for (var i = 0; i < count; i++) {
            var angle = (Math.PI * 2 * i) / count + (ring ? 0.13 : 0);
            var speed = (ring === 0 ? 3.2 : 1.9) + Math.random() * 1.6;
            particles.push({
              x: cx, y: cy,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              size: ring === 0 ? 1.4 : 2.1,
              life: 1,
              decay: 0.012 + Math.random() * 0.012,
              color: palette[Math.floor(Math.random() * palette.length)]
            });
          }
        }

        var frame = 0;
        (function render() {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          frame++;
          particles.forEach(function (p) {
            p.x += p.vx; p.y += p.vy;
            p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.012; // trọng lực nhẹ
            p.life -= p.decay;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(" + p.color + "," + Math.max(p.life, 0) + ")";
            ctx.shadowBlur = 8;
            ctx.shadowColor = "rgba(" + p.color + ",0.9)";
            ctx.fill();
          });
          if (frame < 110) requestAnimationFrame(render);
          else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        })();
      }

      /* ---- 3. Mở thiệp ----
         Khi nhúng vào site thật, thay setTimeout cuối bằng:
         window.location.href = "index.html" hoặc gọi openEnvelope(). */
      function openInvitation() {
        if (cover.classList.contains("is-opening")) return;
        cancelAutoOpen();
        playOpeningBurst();
        if (navigator.vibrate) { try { navigator.vibrate([25, 40, 25]); } catch (e) { } }
        cover.classList.add("is-opening");
        setTimeout(function () {
          // TODO dự án thật: window.location.href = "index.html";
          cover.classList.remove("is-opening");
        }, 1600);
      }

      openBtn.addEventListener("click", openInvitation);
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && document.activeElement === openBtn) return;
        if (ev.key === "Enter") openInvitation();
      });

      /* ---- 4. TỰ MỞ THIỆP SAU 3–5s NẾU KHÁCH KHÔNG BẤM ---- */
      var AUTO_OPEN_MIN = 3000;
      var AUTO_OPEN_MAX = 5000;
      var autoOpenDelay = Math.floor(AUTO_OPEN_MIN + Math.random() * (AUTO_OPEN_MAX - AUTO_OPEN_MIN));
      var autoOpenTimer = null;
      var tickTimer = null;
      var cancelled = false;

      function cancelAutoOpen() {
        if (cancelled) return;
        cancelled = true;
        if (autoOpenTimer) { clearTimeout(autoOpenTimer); autoOpenTimer = null; }
        if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
        autoOpenNote.classList.remove("is-visible");
        setTimeout(function () {
          if (cancelled) autoOpenNote.style.display = "none";
        }, 600);
      }

      // Bắt đầu đếm sau khi các animation chào mừng hiện xong (~2s)
      setTimeout(function () {
        if (cancelled) return;
        var endAt = Date.now() + autoOpenDelay;
        autoOpenNote.classList.add("is-visible");
        autoOpenSeconds.textContent = String(Math.ceil(autoOpenDelay / 1000));

        tickTimer = setInterval(function () {
          var remain = endAt - Date.now();
          autoOpenSeconds.textContent = remain <= 0 ? "0" : String(Math.ceil(remain / 1000));
        }, 250);

        autoOpenTimer = setTimeout(function () {
          if (cancelled) return;
          openInvitation();
        }, autoOpenDelay);
      }, 2000);

      // Huỷ tự mở khi khách chủ động tương tác
      ["pointerdown", "keydown", "wheel", "touchstart"].forEach(function (evt) {
        document.addEventListener(evt, cancelAutoOpen, { passive: true, once: true });
      });
    })();
  </script>
</body>

</html>
